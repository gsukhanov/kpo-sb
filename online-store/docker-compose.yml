services:
  api-gateway:
    build:
      context: ./api-gateway
    environment:
      SERVER_PORT: '8080'
      ORDERS_SERVICE_URL: http://orders-service:8081
      PAYMENTS_SERVICE_URL: http://payments-service:8082
    ports:
    - 8080:8080
    depends_on:
      orders-service:
        condition: service_started
      payments-service:
        condition: service_started
  postgres-orders:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
    - 5433:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d orders_db
      interval: 5s
      timeout: 3s
      retries: 20
  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
    - payments_db_data:/var/lib/postgresql/data
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d payments_db
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
    - 9092:9092
  orders-service:
    build:
      context: ./orders-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orders:5432/orders_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: '8081'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_REQUESTED_TOPIC: orders.payments.requested
      PAYMENT_RESULT_TOPIC: payments.orders.result
      SPRING_KAFKA_CONSUMER_GROUP_ID: orders-service
      OUTBOX_PUBLISH_INTERVAL_MS: '500'
    ports:
    - 8081:8081
    depends_on:
      postgres-orders:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  payments-service:
    build:
      context: ./payments-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payments-db:5432/payments_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: '8082'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_REQUESTED_TOPIC: orders.payments.requested
      PAYMENT_RESULT_TOPIC: payments.orders.result
      OUTBOX_PUBLISH_INTERVAL_MS: '500'
    ports:
    - 8082:8082
    depends_on:
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  frontend-user:
    build:
      context: ./frontend-user
    ports:
    - 3000:80
    depends_on:
    - api-gateway
  frontend-dev:
    build:
      context: ./frontend-dev
    ports:
    - 3001:80
    depends_on:
    - api-gateway
  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_started
    command:
    - sh
    - -c
    - echo 'Waiting for Kafka...'; until /opt/kafka/bin/kafka-topics.sh --bootstrap-server
      kafka:9092 --list >/dev/null 2>&1; do sleep 2; done; /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.payments.requested
      --partitions 1 --replication-factor 1; /opt/kafka/bin/kafka-topics.sh --bootstrap-server
      kafka:9092 --create --if-not-exists --topic payments.orders.result --partitions
      1 --replication-factor 1; echo 'Kafka topics ready.'
    restart: 'no'
volumes:
  payments_db_data: null
